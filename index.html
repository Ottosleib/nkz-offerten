<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NKZ Offerten-Generator</title>
<style>
body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:#f7f8fa;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;max-width:340px}
h1{font-size:18px;color:#de1f4b;margin:0 0 6px}
p{font-size:13px;color:#4b5663;margin:0 0 18px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}
button{margin-top:12px;width:100%;padding:11px;background:#f7376e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#de1f4b}
#err{color:#de1f4b;font-size:12px;margin-top:10px;display:none}
</style>
<script src="ct1.js"></script>
<script src="ct2.js"></script>
<script src="ct3.js"></script>
<script src="ct4.js"></script>
<script src="ct5.js"></script>
<script src="ct6.js"></script>
</head><body>
<div class="box">
<h1>NKZ Offerten-Generator</h1>
<p>Bitte Team-Passwort eingeben</p>
<input id="pw" type="password" autofocus>
<button id="go">&Ouml;ffnen</button>
<div id="err">Falsches Passwort</div>
</div>
<script>
const SALT="kdPPlgzlyexlSgDB3JQ6HQ==",NONCE="6LQFoe7OuLpYBnNE";
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById("pw").value;
  try{
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:fromB64(SALT),iterations:300000,hash:"SHA-256"},
      await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]),
      {name:"AES-GCM",length:256},false,["decrypt"]);
    const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(NONCE)},key,fromB64(window.CTP.join("")));
    const ds=new DecompressionStream("gzip");
    const pt=await new Response(new Blob([gz]).stream().pipeThrough(ds)).text();
    document.open();document.write(pt);document.close();
  }catch(e){document.getElementById("err").style.display="block";}
}
document.getElementById("go").onclick=unlock;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
</script></body></html>
